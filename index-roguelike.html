<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tunnel Run</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06080f;font-family:"Segoe UI",system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:0;left:0;right:0;min-height:64px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 28px;pointer-events:none;color:#dfe6ff}
  .logo{font-weight:800;font-size:22px;letter-spacing:6px;text-transform:uppercase;color:#fff;opacity:.9}
  .logo b{color:var(--accent,#4fd1ff)}
  .stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip,.hpbox{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-weight:600;letter-spacing:1px;font-size:12px;text-transform:uppercase;box-sizing:border-box}
  .chip span{color:#fff;font-size:16px;margin-left:8px;font-variant-numeric:tabular-nums}
  #shieldChip{border-color:rgba(111,227,255,.7);background:rgba(111,227,255,.1)}
  #shieldChip span{color:#6fe3ff}
  .hpbox{min-width:200px}
  .hplabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between}
  .hplabel span{color:#fff}
  .hptrack{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
  #hpFill{height:100%;width:100%;background:#3fcf5a;border-radius:5px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,12,.78);backdrop-filter:blur(3px);cursor:pointer}
  #overlay.hide{display:none}
  .card{max-width:480px;text-align:center;padding:30px 38px 26px;background:#0e1424;color:#dfe6ff;border-radius:16px;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 60px rgba(79,209,255,.15)}
  .card h1{margin:0 0 8px;font-weight:800;font-size:46px;letter-spacing:8px;color:#fff}
  .card h2{margin:0 0 8px;font-weight:800;font-size:34px;letter-spacing:4px;color:#fff}
  .card p{margin:10px 0;font-size:15px;line-height:1.5;color:#b8c3e6}
  .card b{color:#fff}
  .btn{display:inline-block;margin-top:10px;padding:11px 30px;border-radius:999px;background:#4fd1ff;font-weight:800;font-size:15px;letter-spacing:2px;color:#04121a}
  .small{font-size:12px!important;opacity:.7}
  .big{font-size:20px!important;font-weight:700;color:#fff!important}
  .legend{display:flex;justify-content:center;gap:18px;font-size:13px;margin:8px 0;color:#b8c3e6}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  @media (max-width:760px){
    #hud{padding:6px 10px;justify-content:center}
    .logo{font-size:16px;letter-spacing:4px}
    .chip{padding:4px 8px;font-size:10px}
    .chip span{font-size:13px}
    .hpbox{min-width:140px}
    .card{margin:0 14px;padding:22px 20px}
    .card h1{font-size:34px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="logo">Tunnel<b>·</b>Run</div>
  <div class="stats">
    <div class="chip">Level<span id="hLevel">1</span></div>
    <div class="hpbox"><div class="hplabel">HP <span id="hpText">100/100</span></div><div class="hptrack"><div id="hpFill"></div></div></div>
    <div class="chip" id="shieldChip" style="display:none">Shield<span id="hShield"></span></div>
    <div class="chip">Time<span id="hTime">0.0</span></div>
    <div class="chip">Best Lv<span id="hBest">–</span></div>
    <div class="chip">Sound<span id="hSound">ON</span></div>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('overlay'), card = document.getElementById('card'), hud = document.getElementById('hud');
const hLevel = document.getElementById('hLevel'), hTime = document.getElementById('hTime'), hBest = document.getElementById('hBest'), hSound = document.getElementById('hSound');
const hpFill = document.getElementById('hpFill'), hpText = document.getElementById('hpText');
const shieldChip = document.getElementById('shieldChip'), hShield = document.getElementById('hShield');
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tuning ---------- */
const MAXHP = 100;          // starting and maximum health
const HEAL = 30;            // health potion
const SHIELD_HITS = 3;      // invincibility potion: wall hits ignored
const SHIELD_CAP = 6;
const IFRAMES = 0.6;        // seconds of grace after any wall touch
const ARM_IFRAMES = 0.5;    // grace right after the cursor grabs the dot
const SPAWN_IFRAMES = 1.0;  // grace when a new level starts, so momentum can't cost HP
const dmgFor = L => Math.min(30, 5 + Math.floor(L * 1.2));          // wall damage grows with level
const gridCols = L => Math.min(34, 6 + 2 * (L - 1));                // level 1 is a tiny 6x4 maze
const corridorK = L => Math.max(.115, .2 - .0045 * (L - 1));        // tunnels narrow with depth

const BOT = 40, SIDE = 36, MAXJUMP = 160, BG = '#06080f';
let W, H, dpr, topY = 90;
let level = 1, runSeed = (Math.random() * 1e9) | 0, startCorner = 0;
let hp = MAXHP, hpShown = MAXHP, shield = 0, iframes = 0;
let state = 'menu';            // menu | playing | paused | dead
let armed = false, started = false, deadReady = false;
let px = 0, py = 0;
let runTime = 0, lastNow = 0, hitT = -9999, hitKind = 'hp';
let G = null, stat = null;
const floaters = [], tail = [];
let anchor = null;                        // screen point the next maze's START must land on (the cursor)
let serial = 0;                           // bumps on each new level so stale pointer events can be dropped
let fadeSnap = null, fadeA = 0, bannerT = 9;

let bestLevel = 0;
try { bestLevel = +localStorage.getItem('zipit.bestLevel') || 0; } catch (e) {}
function noteBest() {
  if (level > bestLevel) { bestLevel = level; try { localStorage.setItem('zipit.bestLevel', String(bestLevel)); } catch (e) {} }
}
// each level gets its own neon hue
const hue = () => (200 + level * 37) % 360;
const accent = (a = 1, l = 60) => `hsla(${hue()},90%,${l}%,${a})`;

/* ---------- audio ---------- */
let ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function blip(type, f0, f1, dur, vol) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sndHit = () => { blip('sawtooth', 400, 90, 0.25, 0.08); blip('square', 1800, 300, 0.15, 0.025); };
const sndShield = () => { blip('triangle', 900, 1500, 0.18, 0.1); };
const sndDie = () => { blip('sawtooth', 520, 50, 0.7, 0.1); blip('square', 2400, 200, 0.5, 0.03); };
const sndHeal = () => { [523, 659, 880].forEach((f, i) => setTimeout(() => blip('triangle', f, f * 1.02, 0.18, 0.1), i * 70)); };
const sndPower = () => { [440, 660, 990, 1320].forEach((f, i) => setTimeout(() => blip('square', f, f * 1.01, 0.14, 0.05), i * 60)); };
function sndWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip('triangle', f, f, 0.25, 0.12), i * 110)); }

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- level generation ---------- */
// Each level is deterministic from (runSeed, level, startCorner), so a resize rebuilds the same maze.
// The level's START is the corner where the previous level ended, placed exactly under the cursor.
const cornerCell = (k, cols, rows) => [0, cols - 1, (rows - 1) * cols, rows * cols - 1][k];

function build() {
  topY = Math.max(90, hud.getBoundingClientRect().bottom + 16);
  const aw = W - SIDE * 2, ah = H - topY - BOT;
  let cols = gridCols(level), rows = Math.max(4, Math.round(cols * .58));
  if (aw < ah) [cols, rows] = [rows, cols];                   // portrait screens get a tall maze
  const Sfree = Math.max(8, Math.min(aw / cols, ah / rows));
  let S = Sfree, ox, oy, anchored = false;
  if (anchor) {
    const left = startCorner % 2 === 0, top = startCorner < 2;
    const roomX = left ? W - SIDE - anchor.x : anchor.x - SIDE, roomY = top ? H - BOT - anchor.y : anchor.y - topY;
    const edgeX = Math.min(anchor.x - SIDE, W - SIDE - anchor.x), edgeY = Math.min(anchor.y - topY, H - BOT - anchor.y);
    const Sa = Math.min(Sfree, roomX / (cols - .5), roomY / (rows - .5), 2 * edgeX, 2 * edgeY);
    if (Sa >= Sfree * .6) {                    // otherwise the cursor is nowhere near the expected corner: fall back to centred
      anchored = true; S = Math.max(8, Sa);
      ox = left ? anchor.x - S / 2 : anchor.x - (cols - .5) * S;
      oy = top ? anchor.y - S / 2 : anchor.y - (rows - .5) * S;
    }
  }
  if (!anchored) { ox = (W - cols * S) / 2; oy = topY + (ah - rows * S) / 2; }
  const hw = S * corridorK(level);
  const rnd = mulberry(runSeed + level * 7919 + 13);
  const N = cols * rows;

  const opp = 3 - startCorner, others = [0, 1, 2, 3].filter(k => k !== startCorner && k !== opp);
  const endCorner = rnd() < .6 ? opp : others[(rnd() * 2) | 0];
  const startCell = cornerCell(startCorner, cols, rows), endCell = cornerCell(endCorner, cols, rows);

  const seen = new Uint8Array(N), par = new Int32Array(N).fill(-1);
  const edges = [], stack = [startCell]; seen[startCell] = 1;
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % cols, y = (c / cols) | 0, nb = [];
    if (x > 0 && !seen[c - 1]) nb.push(c - 1);
    if (x < cols - 1 && !seen[c + 1]) nb.push(c + 1);
    if (y > 0 && !seen[c - cols]) nb.push(c - cols);
    if (y < rows - 1 && !seen[c + cols]) nb.push(c + cols);
    if (!nb.length) { stack.pop(); continue; }
    const m = nb[(rnd() * nb.length) | 0]; seen[m] = 1; par[m] = c; edges.push([c, m]); stack.push(m);
  }
  const X = c => ox + (c % cols + .5) * S, Y = c => oy + ((c / cols | 0) + .5) * S;

  // wall lookup: which neighbours each cell connects to (1=right 2=down 4=left 8=up)
  const adj = new Uint8Array(N);
  for (const [a, b] of edges) {
    if (b === a + 1) { adj[a] |= 1; adj[b] |= 4; } else if (b === a - 1) { adj[a] |= 4; adj[b] |= 1; }
    else if (b === a + cols) { adj[a] |= 2; adj[b] |= 8; } else { adj[a] |= 8; adj[b] |= 2; }
  }
  // the player is a dot; its hitbox is exactly the dot
  const dr = Math.min(9, Math.max(3, hw * .26)), probes = [[0, 0]];
  for (let i = 0; i < 32; i++) probes.push([Math.cos(i * Math.PI / 16) * dr, Math.sin(i * Math.PI / 16) * dr]);
  const armR = Math.max(hw * 1.2, 14);

  // potions: random per level. Most sit on the main route, some in dead ends (risk/reward).
  const route = new Set(); for (let c = par[endCell]; c !== -1 && c !== startCell; c = par[c]) route.add(c);
  const routeCells = [...route], sideCells = [];
  for (let c = 0; c < N; c++) if (c !== startCell && c !== endCell && !route.has(c)) sideCells.push(c);
  const pickups = [], used = new Set();
  function place(type) {
    for (let tries = 0; tries < 20; tries++) {
      const useRoute = routeCells.length && (rnd() < .65 || !sideCells.length), pool = useRoute ? routeCells : sideCells;
      if (!pool.length) return;
      const c = pool[(rnd() * pool.length) | 0];
      if (used.has(c)) continue;
      used.add(c); pickups.push({ c, x: X(c), y: Y(c), type, taken: false, ph: rnd() * 6.28 }); return;
    }
  }
  let nHp = 0, nSh = 0;
  if (level >= 2) {
    nHp = level <= 3 ? (rnd() < .5 ? 1 : 0) : (rnd() < .75 ? 1 : 0) + (rnd() < .3 ? 1 : 0) + (level >= 8 && rnd() < .2 ? 1 : 0);
    if (level >= 3 && rnd() < (level >= 10 ? .25 : .18)) nSh = 1;
  }
  for (let i = 0; i < nHp; i++) place('hp');
  for (let i = 0; i < nSh; i++) place('shield');

  G = {
    cols, rows, S, ox, oy, hw, dr, armR, edges, adj, X, Y, N, probes, pickups, startCorner, endCorner,
    SX: X(startCell), SY: Y(startCell), EX: X(endCell), EY: Y(endCell)
  };
  renderStatic();
}

// Exact geometry test (no pixels): is (x,y) inside the open tunnel? Tunnels are capsules of
// radius hw along the grid edges, so only the cell's own node and its incident edges matter.
function inside(x, y) {
  const S = G.S, fx = (x - G.ox) / S, fy = (y - G.oy) / S;
  if (fx < 0 || fy < 0 || fx >= G.cols || fy >= G.rows) return false;
  const cx = fx | 0, cy = fy | 0, m = G.adj[cy * G.cols + cx], dx = (fx - cx - .5) * S, dy = (fy - cy - .5) * S, hw = G.hw;
  if (dx * dx + dy * dy <= hw * hw) return true;
  if (Math.abs(dy) <= hw && ((dx >= 0 && (m & 1)) || (dx <= 0 && (m & 4)))) return true;
  if (Math.abs(dx) <= hw && ((dy >= 0 && (m & 2)) || (dy <= 0 && (m & 8)))) return true;
  return false;
}
function safe(x, y) { for (const p of G.probes) if (!inside(x + p[0], y + p[1])) return false; return true; }

function pathEdges(g) { g.beginPath(); for (const [a, b] of G.edges) { g.moveTo(G.X(a), G.Y(a)); g.lineTo(G.X(b), G.Y(b)); } }

function renderStatic() {
  const { hw } = G;
  stat = mk(Math.ceil(W * dpr), Math.ceil(H * dpr));
  const g = stat.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // neon wall line centred on the real collision boundary (radius hw), then the tunnel floor inside it
  g.save(); g.shadowColor = accent(.9, 55); g.shadowBlur = 16;
  g.strokeStyle = accent(1, 62); g.lineWidth = hw * 2 + 3; pathEdges(g); g.stroke(); g.restore();
  g.strokeStyle = '#0b1122'; g.lineWidth = hw * 2 - 3; pathEdges(g); g.stroke();
  g.strokeStyle = '#0f1830'; g.lineWidth = hw * 1.3; pathEdges(g); g.stroke();
  g.strokeStyle = '#131f3d'; g.lineWidth = hw * .6; pathEdges(g); g.stroke();
}

/* ---------- game logic ---------- */
function resetRun() {      // reset the position on the current level (HP and potions are kept)
  px = G.SX; py = G.SY;
  started = false; armed = false; iframes = 0; tail.length = 0;
}
function newRun() {
  runSeed = (Math.random() * 1e9) | 0; level = 1; startCorner = 0; anchor = null; fadeSnap = null; fadeA = 0; bannerT = 0;
  hp = hpShown = MAXHP; shield = 0; runTime = 0; floaters.length = 0;
  build(); resetRun();
}
function floater(txt, color) { floaters.push({ x: px, y: py - G.hw * 1.2, txt, color, t: 0 }); }

function collect(x, y) {
  const cr = Math.max(G.hw * .8, 10) + G.dr;
  for (const p of G.pickups) if (!p.taken && Math.hypot(p.x - x, p.y - y) < cr) {
    p.taken = true;
    if (p.type === 'hp') { hp = Math.min(MAXHP, hp + HEAL); sndHeal(); floater('+' + HEAL + ' HP', '#6dff8c'); }
    else { shield = Math.min(SHIELD_CAP, shield + SHIELD_HITS); sndPower(); floater('SHIELD ×' + SHIELD_HITS, '#6fe3ff'); }
  }
}
function hitWall() {
  if (iframes > 0) return;
  iframes = IFRAMES; hitT = performance.now();
  if (shield > 0) { shield--; hitKind = 'shield'; sndShield(); floater('BLOCKED', '#6fe3ff'); return; }
  const d = dmgFor(level); hp = Math.max(0, hp - d); hitKind = 'hp'; sndHit(); floater('-' + d, '#ff6b6b');
  if (hp <= 0) gameOver();
}
function gameOver() {
  state = 'dead'; armed = false; deadReady = false; noteBest(); sndDie();
  const secs = runTime.toFixed(1), lv = level;
  setTimeout(() => {
    deadReady = true;
    show(`<h2>RUN OVER</h2><p class="big">You reached level ${lv}</p>
      <p>Best: <b>level ${bestLevel}</b> &nbsp;·&nbsp; Run time: <b>${secs}s</b></p><div class="btn">TRY AGAIN ▶</div>`);
  }, 900);
}
// Reaching END starts the next level immediately: its START is placed exactly on the cursor, so the
// player never has to travel (or take damage) to reach it. The old maze fades away over the top.
function levelClear(cx, cy) {
  sndWin();
  fadeSnap = mk(stat.width, stat.height);
  fadeSnap.getContext('2d').drawImage(stat, 0, 0);
  fadeA = 1; bannerT = 0;
  startCorner = G.endCorner;                             // the end of this level is the start of the next
  level++; noteBest(); serial++;
  anchor = { x: cx, y: cy }; build(); anchor = null;
  resetRun();
  px = G.SX; py = G.SY; armed = true; started = true; iframes = SPAWN_IFRAMES;
}
function move(dx, dy, cx, cy) {
  const d = Math.hypot(dx, dy); if (!d) return;
  started = true;
  const steps = Math.ceil(d / 2), sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    if (safe(px + sx, py + sy)) { px += sx; py += sy; }
    else {                                   // wall: take a hit, slide along it if possible
      hitWall(); if (state !== 'playing') return;
      if (sx && safe(px + sx, py)) px += sx; else if (sy && safe(px, py + sy)) py += sy;
    }
    collect(px, py);
    if (Math.hypot(px - G.EX, py - G.EY) < G.hw * .8) { levelClear(cx, cy); return; }
  }
  const l = tail[tail.length - 1];
  if (!l || (px - l.x) ** 2 + (py - l.y) ** 2 > 9) { tail.push({ x: px, y: py }); if (tail.length > 26) tail.shift(); }
}
function disarm() { armed = false; }

/* ---------- input (mouse, pen and touch) ---------- */
function track(x, y) {
  if (state !== 'playing') return;
  if (!armed) {
    // Arm only on a spot that is clear of walls, and snap the dot onto the cursor. Otherwise the
    // first move could drag the dot through a wall and cost HP the moment play begins.
    if (Math.hypot(x - px, y - py) < G.armR && safe(x, y)) { armed = true; px = x; py = y; iframes = Math.max(iframes, ARM_IFRAMES); tail.length = 0; }
    return;
  }
  const dx = x - px, dy = y - py;
  if (Math.hypot(dx, dy) > MAXJUMP) { disarm(); return; }   // cursor teleported or strayed far into the wall
  move(dx, dy, x, y);
}
addEventListener('pointermove', e => {
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [], s0 = serial;
  for (const ev of (list.length ? list : [e])) { track(ev.clientX, ev.clientY); if (state !== 'playing' || serial !== s0) break; }
});
addEventListener('pointerdown', e => track(e.clientX, e.clientY));
const lift = e => { if (e.pointerType !== 'mouse' && state === 'playing') disarm(); };
addEventListener('pointerup', lift); addEventListener('pointercancel', lift);
document.documentElement.addEventListener('mouseleave', () => { if (state === 'playing') disarm(); });

function pause() {
  if (state !== 'playing') return;
  state = 'paused'; disarm();
  show(`<h2>PAUSED</h2><p>Click to resume, then move your cursor back onto the dot.</p><div class="btn">RESUME</div>`);
}
addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

ov.addEventListener('click', () => {
  audio();
  if (!G) { resize(); if (!G) return; }          // layout not ready yet
  if (state === 'dead') { if (!deadReady) return; newRun(); }
  else if (state === 'menu') newRun();
  state = 'playing'; ov.classList.add('hide'); disarm();
});
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { muted = !muted; hSound.textContent = muted ? 'OFF' : 'ON'; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') pause();
});

function show(html) { card.innerHTML = html; ov.classList.remove('hide'); }
function menu() {
  show(`<h1>TUNNEL RUN</h1>
    <p><b>Your cursor (or finger) is the dot.</b><br>Guide it from <b>START</b> to <b>END</b> without touching the walls. Reach the end and that spot becomes the start of the next, harder level.</p>
    <p>Touching a wall costs <b>HP</b>. Run out and the run is over. Collect orbs along the way:</p>
    <div class="legend"><span><i class="dot" style="background:#ff5c7a"></i>Health +${HEAL}</span><span><i class="dot" style="background:#6fe3ff"></i>Shield: ${SHIELD_HITS} free wall hits (rare)</span></div>
    <div class="btn">CLICK TO START</div>
    <p class="small">Esc pauses · M mutes · Touch: drag from START, lift to pause</p>`);
}

/* ---------- rendering ---------- */
function drawPickup(p, now) {
  const r = Math.max(G.hw * .5, 7), pulse = 1 + Math.sin(now / 260 + p.ph) * .12;
  const col = p.type === 'hp' ? '#ff5c7a' : '#6fe3ff';
  ctx.save(); ctx.translate(p.x, p.y);
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4 * pulse);
  gl.addColorStop(0, col + '88'); gl.addColorStop(1, col + '00');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, r * 2.4 * pulse, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r * pulse, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, r * .18); ctx.lineCap = 'round';
  if (p.type === 'hp') { ctx.beginPath(); ctx.moveTo(-r * .5, 0); ctx.lineTo(r * .5, 0); ctx.moveTo(0, -r * .5); ctx.lineTo(0, r * .5); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0, 0, r * .5, 0, 7); ctx.stroke(); }
  ctx.restore();
}

function marker(x, y, color, label, now) {
  const r = G.hw * .7, p = (Math.sin(now / 280) + 1) / 2;
  ctx.save();
  const gl = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
  gl.addColorStop(0, color + '66'); gl.addColorStop(1, color + '00');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = .55 + .4 * p; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -now / 60;
  ctx.beginPath(); ctx.arc(x, y, r + p * 2, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = .9; ctx.fillStyle = color; ctx.font = '700 11px "Segoe UI",Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y - r - 12);
  ctx.restore();
}

function bigText(txt, alpha, size) {
  ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, alpha)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${size}px "Segoe UI",Arial`; ctx.shadowColor = accent(.9, 55); ctx.shadowBlur = 24;
  ctx.fillStyle = '#fff'; ctx.fillText(txt, W / 2, H / 2); ctx.restore();
}

function updateHud() {
  hLevel.textContent = level; hTime.textContent = runTime.toFixed(1);
  hBest.textContent = bestLevel || '–';
  const pct = Math.max(0, hpShown) / MAXHP;
  hpFill.style.width = (pct * 100) + '%';
  hpFill.style.background = pct > .5 ? '#3fcf5a' : pct > .25 ? '#e8c13a' : '#e5412f';
  hpText.textContent = Math.ceil(hp) + '/' + MAXHP;
  shieldChip.style.display = shield > 0 ? '' : 'none';
  hShield.textContent = '◆'.repeat(shield);
  document.documentElement.style.setProperty('--accent', accent(1, 62));
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!G) return;
  const dtf = Math.min(now - lastNow, 100) / 1000; lastNow = now;
  if (state === 'playing' && started && armed) runTime += dtf;
  if (state === 'playing') iframes = Math.max(0, iframes - dtf);
  hpShown += (hp - hpShown) * (1 - Math.exp(-dtf * 9));
  updateHud();
  cv.style.cursor = (state === 'playing' && armed) ? 'none' : (state === 'playing' ? 'default' : 'pointer');
  if (fadeSnap) { fadeA -= dtf / .55; if (fadeA <= 0) { fadeSnap = null; fadeA = 0; } }
  bannerT += dtf;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const dt = now - hitT; let sx = 0, sy = 0;
  if (!RM && dt < 300 && hitKind === 'hp') { const k = 1 - dt / 300; sx = (Math.random() - .5) * 10 * k; sy = (Math.random() - .5) * 10 * k; }
  ctx.save(); ctx.translate(sx, sy);
  ctx.drawImage(stat, 0, 0, W, H);
  if (fadeSnap) { ctx.save(); ctx.globalAlpha = fadeA * fadeA * (3 - 2 * fadeA); ctx.drawImage(fadeSnap, 0, 0, W, H); ctx.restore(); }

  marker(G.SX, G.SY, '#5dff9a', 'START', now);
  marker(G.EX, G.EY, '#ffd24a', 'END', now);
  for (const pk of G.pickups) if (!pk.taken) drawPickup(pk, now);

  if (state !== 'menu' && state !== 'dead') {
    const dr = G.dr, blink = iframes > 0 && iframes < SPAWN_IFRAMES - 1e-3 && Math.floor(now / 80) % 2 === 0 && now - hitT < IFRAMES * 1000 + 50;
    // comet tail
    for (let i = 1; i < tail.length; i++) {
      const a = tail[i - 1], b = tail[i], k = i / tail.length;
      ctx.strokeStyle = accent(.5 * k, 70); ctx.lineWidth = dr * 2 * k; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    if (state === 'playing' && !armed) {     // ring showing where to put the cursor
      const p = (Math.sin(now / 280) + 1) / 2;
      ctx.save(); ctx.strokeStyle = `rgba(93,255,154,${.5 + .4 * p})`; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(px, py, G.armR, 0, 7); ctx.stroke(); ctx.restore();
    }
    if (shield > 0) {
      const p = (Math.sin(now / 200) + 1) / 2;
      ctx.save(); ctx.strokeStyle = `rgba(111,227,255,${.6 + .3 * p})`; ctx.fillStyle = 'rgba(111,227,255,.14)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, dr * 2, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = (state === 'playing' && !armed) ? .5 : blink ? .35 : 1;
    const gl = ctx.createRadialGradient(px, py, 0, px, py, dr * 3.2);
    gl.addColorStop(0, accent(.55, 70)); gl.addColorStop(1, accent(0, 70));
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(px, py, dr * 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, dr, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dtf; if (f.t > 1.1) { floaters.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = 1 - f.t / 1.1; ctx.font = '800 20px "Segoe UI",Arial'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#06080f'; ctx.strokeText(f.txt, f.x, f.y - f.t * 36); ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y - f.t * 36); ctx.restore();
  }

  if (dt < 450) { const c = hitKind === 'shield' ? '90,200,255' : '230,40,40'; ctx.fillStyle = `rgba(${c},${(RM ? .1 : .25) * (1 - dt / 450)})`; ctx.fillRect(0, 0, W, H); }
  if (hp > 0 && hp / MAXHP <= .25 && state === 'playing' && !RM) {
    const a = .12 + .1 * Math.sin(now / 200), vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(200,20,20,0)'); vg.addColorStop(1, `rgba(200,20,20,${a * 3})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  if (level > 1 && bannerT < 1.3 && state === 'playing') bigText(`LEVEL ${level}`, bannerT < .15 ? bannerT / .15 : 1 - (bannerT - .5) / .8, Math.min(64, W / 9));
  if (state === 'playing' && !armed) {
    ctx.fillStyle = '#cfe3ff'; ctx.font = '600 18px "Segoe UI",Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
    ctx.fillText(!started && level === 1 ? 'Move your cursor onto START to begin' : 'Move your cursor onto the dot to continue', W / 2, topY - 8); ctx.shadowBlur = 0;
  }
}

function resize() {
  if (!innerWidth || !innerHeight) { setTimeout(resize, 100); return; }      // pane not laid out yet: try again shortly
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const prev = G && { S: G.S, ox: G.ox, oy: G.oy, cols: G.cols, rows: G.rows, taken: G.pickups.map(p => p.taken) };
  build();
  if (prev && prev.cols === G.cols && prev.rows === G.rows) {   // same maze, new scale: keep the run
    prev.taken.forEach((t, i) => { if (G.pickups[i]) G.pickups[i].taken = t; });
    const k = G.S / prev.S; px = G.ox + (px - prev.ox) * k; py = G.oy + (py - prev.oy) * k;
    fadeSnap = null; tail.length = 0;
    if (state === 'playing') disarm();
  } else { resetRun(); }
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });

resize(); menu(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
